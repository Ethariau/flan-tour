<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement – Flan tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="results">
<header class="compact">
  <a href="index.html"><img class="logo" src="logo.png" width="900" height="410" alt="Flan-Tour Bordeaux, retour à l'accueil"></a>
  <h1>Le classement</h1>
  <p>Bordeaux, toujours plus bon !</p>
</header>
<main>
  <a class="retour" href="index.html">Retour à l'accueil</a>
  <section class="card verrou-carte" id="verrou" hidden>
    <h2>Classement verrouillé</h2>
    <p>Le classement général sera dévoilé à la fin du tour, lors de la révélation du podium. Reviens à ce moment-là !</p>
  </section>
  <p class="etat" id="etat" role="status">Chargement…</p>
  <ol class="classement" id="classement"></ol>
  <button class="btn" id="maj" type="button">Actualiser</button>
</main>
<footer class="pied">Le flan rapproche les gens</footer>
<script src="app.js"></script>
