<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon classement – Flan tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">
</head>
<body data-page="perso">
<header class="compact">

  <h1 id="titre-perso">Mon classement</h1>

<main>

<footer class="pied">Le flan rapproche les gens</footer>
<script src="app.js"></script>
<script src="perso.js"></script>
<script>
  if (typeof initPerso === 'undefined' || typeof getStatut === 'undefined') {
    document.getElementById('etat').textContent = "Fichiers manquants ou pas à jour : vérifie perso.js et la dernière version d'app.js.";
  }
